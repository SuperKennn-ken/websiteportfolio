<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#bae6fd">
<title>Jhon Kenneth Sevillano — Light & Dark Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">

<!-- set theme before paint (no flash) -->
<script>
  (function(){
    var t;
    try { t = localStorage.getItem('theme'); } catch(e){}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>

<style>
  /* ================= THEME TOKENS ================= */
  :root{
    --sky:linear-gradient(180deg,#bae6fd 0%,#dbeafe 45%,#dcfce7 100%);
    --title:#1e3a8a; --text:#14532d; --muted:#1d4ed8; --accent:#3b82f6; --accent2:#16a34a;
    --card:rgba(255,255,255,.55); --card-border:rgba(59,130,246,.35); --card-shadow:rgba(30,64,175,.25);
    --chip:rgba(59,130,246,.12); --img-border:#ffffff;
    --r1:#3b82f6; --r2:#22d3ee; --r3:#16a34a; --r4:#facc15;
    --hill1:#86efac; --hill2:#22c55e;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --sky:linear-gradient(180deg,#020b1a 0%,#0a1f3d 50%,#052e16 100%);
    --title:#e0ecff; --text:#cfe2ff; --muted:#93c5fd; --accent:#60a5fa; --accent2:#4ade80;
    --card:rgba(10,22,40,.55); --card-border:rgba(96,165,250,.3); --card-shadow:rgba(0,0,0,.55);
    --chip:rgba(96,165,250,.14); --img-border:#0b1b33;
    --r1:#60a5fa; --r2:#22d3ee; --r3:#4ade80; --r4:#a78bfa;
    --hill1:#14532d; --hill2:#04210f;
    color-scheme:dark;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Outfit',Arial,sans-serif;
    min-height:100vh;padding:20px;
    display:grid;place-items:center;text-align:center;
    background:var(--sky);background-attachment:fixed;
    color:var(--text);overflow-x:hidden;perspective:1200px;
    transition:color .6s;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
  @keyframes angSpin{to{--ang:360deg}}

  /* circular reveal (View Transitions API) */
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
  ::view-transition-old(root){z-index:1}
  ::view-transition-new(root){z-index:2}

  /* ================= SCENE ================= */
  .scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #sky,#fx{position:absolute;inset:0;width:100%;height:100%}
  #fx{position:fixed;z-index:50;pointer-events:none}

  .sun,.moon{position:absolute;top:9%;right:11%;border-radius:50%;
    transition:transform 1.1s cubic-bezier(.65,0,.35,1),opacity .9s ease}
  .sun{width:90px;height:90px;
    background:radial-gradient(circle at 40% 40%,#fef9c3,#facc15 55%,#f59e0b);
    box-shadow:0 0 60px 18px rgba(250,204,21,.45);animation:sunGlow 4s ease-in-out infinite}
  .sun::before{content:"";position:absolute;inset:-30px;border-radius:50%;
    background:repeating-conic-gradient(rgba(253,224,71,.6) 0 6deg,transparent 6deg 30deg);
    -webkit-mask:radial-gradient(circle,transparent 52px,#000 55px,transparent 75px);
            mask:radial-gradient(circle,transparent 52px,#000 55px,transparent 75px);
    animation:spin 22s linear infinite}
  @keyframes sunGlow{50%{box-shadow:0 0 90px 30px rgba(250,204,21,.55)}}

  .moon{width:80px;height:80px;opacity:0;transform:translateY(70vh) rotate(-90deg) scale(.6);
    background:
      radial-gradient(circle at 30% 35%,#cbd5e1 0 8px,transparent 9px),
      radial-gradient(circle at 62% 62%,#cbd5e1 0 12px,transparent 13px),
      radial-gradient(circle at 72% 28%,#cbd5e1 0 5px,transparent 6px),
      radial-gradient(circle at 40% 40%,#f8fafc,#e2e8f0 70%,#cbd5e1);
    box-shadow:0 0 50px 12px rgba(191,219,254,.35),inset -10px -8px 0 rgba(148,163,184,.35)}
  [data-theme="dark"] .sun{opacity:0;transform:translateY(70vh) rotate(90deg) scale(.6)}
  [data-theme="dark"] .moon{opacity:1;transform:none}

  .cloud{position:absolute;left:0;width:var(--w);height:calc(var(--w) * .32);top:var(--t);
    background:#fff;border-radius:999px;opacity:.9;
    filter:drop-shadow(0 10px 14px rgba(30,64,175,.12));
    animation:drift var(--d) linear infinite;animation-delay:var(--dl);
    transition:opacity .9s}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:50%;height:150%;left:15%;top:-70%}
  .cloud::after{width:36%;height:115%;left:50%;top:-45%}
  @keyframes drift{from{translate:-30vw 0}to{translate:130vw 0}}
  [data-theme="dark"] .cloud{opacity:0}

  .hills{position:absolute;bottom:0;left:0;width:100%;height:24vh}
  .hills path{transition:fill 1s}
  .hills .h1{fill:var(--hill1)}
  .hills .h2{fill:var(--hill2)}

  /* ================= CARD ================= */
  .card{
    --mx:50%;--my:50%;
    position:relative;z-index:1;isolation:isolate;
    width:min(440px,92vw);padding:2.6rem 2rem 2rem;border-radius:28px;
    background:var(--card);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--card-border);
    box-shadow:0 30px 70px var(--card-shadow),inset 0 1px 0 rgba(255,255,255,.25);
    transform-style:preserve-3d;will-change:transform;
    transition:background .6s,border-color .6s,box-shadow .6s;
    animation:cardIn 1.1s cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(60px) rotateX(25deg) scale(.9);filter:blur(10px)}}
  .card::before{content:"";position:absolute;inset:-2px;border-radius:30px;z-index:-1;padding:2px;
    background:conic-gradient(from var(--ang),var(--r1),var(--r2),var(--r3),var(--r4),var(--r1));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    animation:angSpin 6s linear infinite;opacity:.9}
  .spot{position:absolute;inset:0;border-radius:28px;pointer-events:none;z-index:-1;
    background:radial-gradient(360px circle at var(--mx) var(--my),rgba(96,165,250,.22),transparent 60%);
    opacity:0;transition:opacity .4s}
  .card:hover .spot{opacity:1}

  /* ---------- morphing photo ---------- */
  .photo{position:relative;width:210px;aspect-ratio:1;margin:0 auto 1.5rem;
    transform:translateZ(50px);
    animation:morph 9s ease-in-out infinite,float 6s ease-in-out infinite,pop .9s cubic-bezier(.2,1.5,.4,1) .3s backwards}
  @keyframes morph{
    0%,100%{border-radius:42% 58% 63% 37% / 41% 44% 56% 59%}
    33%{border-radius:63% 37% 38% 62% / 55% 61% 39% 45%}
    66%{border-radius:38% 62% 52% 48% / 62% 38% 62% 38%}}
  @keyframes float{50%{translate:0 -10px}}
  @keyframes pop{from{opacity:0;scale:.3}}
  .photo::before{content:"";position:absolute;inset:-18px;border-radius:inherit;z-index:-1;
    background:conic-gradient(from var(--ang),var(--r1),var(--r2),var(--r3),var(--r4),var(--r1));
    filter:blur(26px);opacity:.6;animation:angSpin 5s linear infinite}
  .photo-ring{position:absolute;inset:-6px;border-radius:inherit;
    background:conic-gradient(from var(--ang),var(--r1),var(--r2),var(--r3),var(--r4),var(--r1));
    animation:angSpin 4s linear infinite}
  .photo img{position:relative;display:block;width:100%;height:100%;object-fit:cover;
    border-radius:inherit;border:5px solid var(--img-border);
    background:linear-gradient(135deg,#1e40af,#16a34a);
    transition:transform .5s cubic-bezier(.2,1.4,.4,1),filter .4s,border-color .6s}
  .photo:hover img{transform:scale(1.06) rotate(-3deg);filter:saturate(125%)}

  /* ---------- text ---------- */
  h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:900;letter-spacing:-.5px;white-space:nowrap;transform:translateZ(35px)}
  h1 .ch{display:inline-block;color:var(--title);min-width:.3em;transition:color .6s;
    animation:drop .9s cubic-bezier(.2,1.5,.4,1) calc(.5s + var(--i) * 45ms) backwards,
              wave 5s ease-in-out calc(2s + var(--i) * 80ms) infinite}
  @keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(-25deg) scale(.3);filter:blur(6px)}}
  @keyframes wave{
    0%,30%,100%{transform:none;text-shadow:none}
    8%{transform:translateY(-7px);color:var(--accent);text-shadow:0 0 16px var(--accent)}
    16%{transform:none;color:var(--accent2)}}

  .role{margin:.4rem 0 1.1rem;font-size:1.1rem;font-weight:500;color:var(--muted);letter-spacing:.3px;
    transform:translateZ(25px);transition:color .6s;animation:rise .7s 1.1s backwards}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}

  .mode-chip{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem 1rem;border-radius:999px;
    background:var(--chip);border:1px solid var(--card-border);font-weight:700;font-size:.85rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);perspective:400px;
    transform:translateZ(25px);transition:background .6s,color .6s;animation:rise .7s 1.25s backwards}
  .mode-chip .flip{display:inline-block}
  .mode-chip.flipping .flip{animation:flip .45s ease-in-out}
  .mode-chip.flipping #modeIcon{animation:iconSpin .6s cubic-bezier(.2,1.4,.4,1)}
  @keyframes flip{50%{transform:rotateX(90deg);opacity:0}}
  @keyframes iconSpin{from{transform:rotate(-180deg) scale(0)}}

  /* ================= DAY/NIGHT SWITCH ================= */
  .switch-wrap{margin-top:1.5rem;transform:translateZ(40px);animation:rise .7s 1.4s backwards}
  .switch{position:relative;width:132px;height:56px;padding:0;border-radius:999px;cursor:pointer;
    overflow:hidden;border:2px solid var(--card-border);background:none;
    box-shadow:0 10px 26px var(--card-shadow),inset 0 3px 8px rgba(0,0,0,.25);
    transition:transform .3s cubic-bezier(.2,1.4,.4,1),box-shadow .3s}
  .switch:hover{transform:scale(1.07);box-shadow:0 14px 34px rgba(96,165,250,.5),inset 0 3px 8px rgba(0,0,0,.25)}
  .switch:active{transform:scale(.96)}
  .switch:focus-visible{outline:3px solid var(--accent2);outline-offset:4px}
  .switch::before,.switch::after{content:"";position:absolute;inset:0;transition:opacity .6s}
  .switch::before{background:linear-gradient(135deg,#7dd3fc,#3b82f6)}
  .switch::after{background:linear-gradient(135deg,#0b1b33,#1e3a8a);opacity:0}
  [data-theme="dark"] .switch::after{opacity:1}

  .sw-clouds{position:absolute;z-index:1;right:4px;bottom:-8px;width:72px;height:42px;
    background:
      radial-gradient(circle at 20% 80%,#fff 0 12px,transparent 13px),
      radial-gradient(circle at 50% 66%,#fff 0 15px,transparent 16px),
      radial-gradient(circle at 82% 82%,#fff 0 13px,transparent 14px);
    transition:transform .6s cubic-bezier(.2,1.4,.4,1),opacity .5s}
  [data-theme="dark"] .sw-clouds{transform:translateY(40px);opacity:0}

  .sw-stars{position:absolute;z-index:1;inset:0;opacity:0;transform:translateY(-16px);
    transition:transform .6s cubic-bezier(.2,1.4,.4,1),opacity .5s}
  [data-theme="dark"] .sw-stars{opacity:1;transform:none}
  .sw-stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;
    box-shadow:0 0 6px #fff;animation:twinkle 1.4s ease-in-out infinite alternate}
  .sw-stars i:nth-child(1){left:16px;top:12px}
  .sw-stars i:nth-child(2){left:34px;top:30px;animation-delay:.3s}
  .sw-stars i:nth-child(3){left:22px;top:38px;width:2px;height:2px;animation-delay:.6s}
  .sw-stars i:nth-child(4){left:52px;top:14px;width:2px;height:2px;animation-delay:.9s}
  .sw-stars i:nth-child(5){left:58px;top:36px;animation-delay:.45s}
  @keyframes twinkle{to{opacity:.2;transform:scale(.5)}}

  .knob{position:absolute;z-index:2;top:5px;left:5px;width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fef9c3,#facc15 60%,#f59e0b);
    box-shadow:0 0 18px 4px rgba(250,204,21,.7),inset -3px -3px 6px rgba(0,0,0,.15);
    transition:transform .75s cubic-bezier(.68,-.45,.27,1.45),background .6s,box-shadow .6s}
  [data-theme="dark"] .knob{transform:translateX(76px) rotate(360deg);
    background:radial-gradient(circle at 35% 35%,#f8fafc,#e2e8f0 65%,#cbd5e1);
    box-shadow:0 0 18px 4px rgba(191,219,254,.6),inset -4px -3px 0 rgba(148,163,184,.4)}
  .crater{position:absolute;border-radius:50%;background:#94a3b8;opacity:0;transform:scale(0);
    transition:opacity .4s .25s,transform .4s .25s cubic-bezier(.2,1.6,.4,1)}
  .crater.c1{width:10px;height:10px;top:8px;left:20px}
  .crater.c2{width:6px;height:6px;top:23px;left:9px}
  .crater.c3{width:8px;height:8px;top:26px;left:24px}
  [data-theme="dark"] .crater{opacity:.75;transform:none}

  .hint{margin-top:1.1rem;font-size:.78rem;letter-spacing:.08em;color:var(--muted);opacity:.75;animation:rise .7s 1.55s backwards}
  kbd{display:inline-block;padding:.05rem .45rem;margin:0 .15rem;border-radius:6px;font:700 .75rem monospace;
    background:var(--chip);border:1px solid var(--card-border);box-shadow:0 2px 0 var(--card-border)}

  /* ================= RESPONSIVE ================= */
  @media (max-width:768px){
    .sun{width:70px;height:70px;right:8%}
    .sun::before{-webkit-mask:radial-gradient(circle,transparent 42px,#000 45px,transparent 65px);mask:radial-gradient(circle,transparent 42px,#000 45px,transparent 65px)}
    .moon{width:62px;height:62px;right:8%}
  }
  @media (max-width:480px){
    body{padding:15px}
    .card{padding:2.1rem 1.3rem 1.7rem}
    .photo{width:170px}
    .role{font-size:.95rem}
    .sun,.moon{top:5%;right:6%;width:54px;height:54px}
    .sun::before{inset:-20px;-webkit-mask:radial-gradient(circle,transparent 30px,#000 33px,transparent 47px);mask:radial-gradient(circle,transparent 30px,#000 33px,transparent 47px)}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  }
</style>
</head>

<body>
  <!-- animated scene -->
  <div class="scene" aria-hidden="true">
    <canvas id="sky"></canvas>
    <div class="sun"></div>
    <div class="moon"></div>
    <div class="cloud" style="--w:180px;--t:14%;--d:70s;--dl:-10s"></div>
    <div class="cloud" style="--w:120px;--t:28%;--d:55s;--dl:-35s"></div>
    <div class="cloud" style="--w:220px;--t:8%;--d:90s;--dl:-60s"></div>
    <div class="cloud" style="--w:90px;--t:40%;--d:45s;--dl:-20s"></div>
    <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path class="h1" d="M0,224L80,202.7C160,181,320,139,480,144C640,149,800,203,960,213.3C1120,224,1280,192,1360,176L1440,160L1440,320L0,320Z"/>
      <path class="h2" d="M0,288L120,266.7C240,245,480,203,720,208C960,213,1200,267,1320,293.3L1440,320L0,320Z"/>
    </svg>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="card" id="card">
    <div class="spot"></div>

    <div class="photo">
      <div class="photo-ring"></div>
      <img src="../../pic/profile.png" alt="Marlou Lecera"
           onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22><rect width=%22300%22 height=%22300%22 fill=%22%231e40af%22/><text x=%2250%25%22 y=%2258%25%22 font-size=%22120%22 fill=%22white%22 font-family=%22sans-serif%22 text-anchor=%22middle%22>ML</text></svg>'">
    </div>

    <h1 id="name">Jhon Kenneth Sevillano</h1>
    <p class="role">Front-End Web Developer</p>

    <div class="mode-chip" id="modeChip">
      <span class="flip" id="modeIcon">☀️</span>
      <span class="flip" id="modeLabel" aria-live="polite">Light Mode</span>
    </div>

    <div class="switch-wrap">
      <button class="switch" id="themeToggle" role="switch" aria-checked="false" aria-label="Toggle dark mode">
        <span class="sw-stars"><i></i><i></i><i></i><i></i><i></i></span>
        <span class="sw-clouds"></span>
        <span class="knob"><span class="crater c1"></span><span class="crater c2"></span><span class="crater c3"></span></span>
      </button>
    </div>

    <p class="hint">Click the switch or press <kbd>D</kbd></p>
  </main>

<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(hover:hover) and (pointer:fine)').matches;
const isDark = () => root.dataset.theme === 'dark';

/* ---------- split name into letters ---------- */
const nameEl = $('#name'), nameText = nameEl.textContent.trim();
nameEl.textContent = ''; nameEl.setAttribute('aria-label', nameText);
[...nameText].forEach((ch, i) => {
  const s = document.createElement('span');
  s.className = 'ch'; s.style.setProperty('--i', i); s.setAttribute('aria-hidden', 'true');
  s.textContent = ch === ' ' ? '\u00A0' : ch;
  nameEl.appendChild(s);
});

/* ---------- theme ---------- */
const toggle = $('#themeToggle'), chip = $('#modeChip'),
      label = $('#modeLabel'), icon = $('#modeIcon'), metaTheme = $('meta[name="theme-color"]');

function syncUI(animate) {
  const dark = isDark();
  toggle.setAttribute('aria-checked', dark);
  metaTheme.content = dark ? '#020b1a' : '#bae6fd';
  const update = () => { label.textContent = dark ? 'Dark Mode' : 'Light Mode'; icon.textContent = dark ? '🌙' : '☀️'; };
  if (!animate) return update();
  chip.classList.remove('flipping'); void chip.offsetWidth; chip.classList.add('flipping');
  setTimeout(update, 220);
}
function applyTheme(t) {
  root.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
  syncUI(true);
}
syncUI(false);

let busy = false;
function switchTheme() {
  if (busy) return;
  const next = isDark() ? 'light' : 'dark';
  const r = toggle.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const sparkle = () => burst(x, y, 60, next === 'dark'
    ? ['#e0f2fe', '#93c5fd', '#60a5fa', '#ffffff', '#a5b4fc']
    : ['#fde047', '#facc15', '#fb923c', '#4ade80', '#ffffff']);

  if (!document.startViewTransition || reduce) { applyTheme(next); sparkle(); return; }

  busy = true;
  const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(() => applyTheme(next));
  vt.ready.then(() => {
    root.animate(
      { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
      { duration: 850, easing: 'cubic-bezier(.65,0,.35,1)', pseudoElement: '::view-transition-new(root)' }
    );
    sparkle();
  });
  vt.finished.finally(() => busy = false);
}
toggle.addEventListener('click', switchTheme);
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'd' || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (/input|textarea|select/i.test(document.activeElement.tagName)) return;
  switchTheme();
});

/* ---------- mouse, tilt & spotlight ---------- */
const mouse = { x: innerWidth / 2, y: innerHeight / 2, in: false };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.in = true; });
document.addEventListener('mouseleave', () => mouse.in = false);
const card = $('#card');
let tx = 0, ty = 0;

/* ---------- canvases ---------- */
const sky = $('#sky'), sctx = sky.getContext('2d');
const fx = $('#fx'), fctx = fx.getContext('2d');
let W, H, stars = [], flies = [], bubbles = [], shooters = [], sparks = [];
const rnd = Math.random;

function init() {
  W = sky.width = fx.width = innerWidth;
  H = sky.height = fx.height = innerHeight;
  stars = Array.from({ length: Math.min(180, W * H / 8000 | 0) }, () =>
    ({ x: rnd() * W, y: rnd() * H * .75, r: rnd() * 1.4 + .3, ph: rnd() * 6.28, sp: rnd() * 2 + .5 }));
  flies = Array.from({ length: 22 }, () =>
    ({ x: rnd() * W, y: H * .55 + rnd() * H * .45, vx: (rnd() - .5) * .5, vy: (rnd() - .5) * .3, ph: rnd() * 6.28 }));
  bubbles = Array.from({ length: 26 }, () =>
    ({ x: rnd() * W, y: rnd() * H, r: rnd() * 14 + 4, vy: -(rnd() * .4 + .15), ph: rnd() * 6.28 }));
}
addEventListener('resize', init); init();

function burst(x, y, n, palette) {
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    const a = rnd() * Math.PI * 2, sp = rnd() * 7 + 2;
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, life: 1,
      decay: .012 + rnd() * .015, size: rnd() * 3 + 1.2, c: palette[rnd() * palette.length | 0] });
  }
}

let mix = isDark() ? 1 : 0;
function loop(now) {
  const t = now / 1000;
  mix += ((isDark() ? 1 : 0) - mix) * .04;

  /* --- tilt + spotlight --- */
  if (finePointer && !reduce) {
    const r = card.getBoundingClientRect();
    const over = mouse.in && mouse.x > r.left && mouse.x < r.right && mouse.y > r.top && mouse.y < r.bottom;
    const x = (mouse.x - r.left) / r.width - .5, y = (mouse.y - r.top) / r.height - .5;
    tx += ((over ? x * 14 : 0) - tx) * .08;
    ty += ((over ? -y * 14 : 0) - ty) * .08;
    card.style.transform = `rotateY(${tx}deg) rotateX(${ty}deg)`;
    card.style.setProperty('--mx', (x + .5) * 100 + '%');
    card.style.setProperty('--my', (y + .5) * 100 + '%');
  }

  /* --- sky --- */
  sctx.clearRect(0, 0, W, H);
  const ox = (mouse.x / W - .5) * -16, oy = (mouse.y / H - .5) * -10;

  if (mix > .01) {
    for (const s of stars) {
      sctx.globalAlpha = mix * (.3 + .7 * Math.abs(Math.sin(t * s.sp + s.ph)));
      sctx.fillStyle = '#fff';
      sctx.beginPath(); sctx.arc(s.x + ox, s.y + oy, s.r, 0, 7); sctx.fill();
    }
    if (mix > .8 && !reduce && rnd() < .005)
      shooters.push({ x: W * (.3 + rnd() * .7), y: rnd() * H * .3, vx: -(7 + rnd() * 5), vy: 3 + rnd() * 2, life: 1 });
    shooters = shooters.filter(s => s.life > 0);
    for (const s of shooters) {
      s.x += s.vx; s.y += s.vy; s.life -= .018;
      const g = sctx.createLinearGradient(s.x, s.y, s.x - s.vx * 12, s.y - s.vy * 12);
      g.addColorStop(0, `rgba(255,255,255,${s.life * mix})`); g.addColorStop(1, 'rgba(147,197,253,0)');
      sctx.globalAlpha = 1; sctx.strokeStyle = g; sctx.lineWidth = 2;
      sctx.beginPath(); sctx.moveTo(s.x, s.y); sctx.lineTo(s.x - s.vx * 12, s.y - s.vy * 12); sctx.stroke();
    }
    for (const f of flies) {
      f.x += f.vx + Math.sin(t + f.ph) * .3; f.y += f.vy + Math.cos(t * .8 + f.ph) * .25;
      if (f.x < -10) f.x = W + 10; if (f.x > W + 10) f.x = -10;
      if (f.y < H * .45) f.vy = Math.abs(f.vy); if (f.y > H) f.vy = -Math.abs(f.vy);
      const a = mix * (.25 + .75 * Math.sin(t * 2 + f.ph) ** 2);
      const g = sctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 10);
      g.addColorStop(0, `rgba(190,255,170,${a})`); g.addColorStop(.3, `rgba(74,222,128,${a * .6})`); g.addColorStop(1, 'rgba(74,222,128,0)');
      sctx.globalAlpha = 1; sctx.fillStyle = g;
      sctx.beginPath(); sctx.arc(f.x, f.y, 10, 0, 7); sctx.fill();
    }
  }
  if (mix < .99) {
    for (const b of bubbles) {
      b.y += b.vy; b.x += Math.sin(t + b.ph) * .3;
      if (b.y < -30) { b.y = H + 30; b.x = rnd() * W; }
      sctx.globalAlpha = 1 - mix;
      sctx.fillStyle = 'rgba(255,255,255,.3)'; sctx.strokeStyle = 'rgba(59,130,246,.3)'; sctx.lineWidth = 1;
      sctx.beginPath(); sctx.arc(b.x - ox, b.y - oy, b.r, 0, 7); sctx.fill(); sctx.stroke();
    }
  }
  sctx.globalAlpha = 1;

  /* --- sparks --- */
  fctx.clearRect(0, 0, W, H);
  sparks = sparks.filter(s => s.life > 0);
  for (const s of sparks) {
    s.x += s.vx; s.y += s.vy; s.vx *= .97; s.vy = s.vy * .97 + .12; s.life -= s.decay;
    fctx.globalAlpha = Math.max(0, s.life); fctx.fillStyle = s.c;
    fctx.shadowBlur = 10; fctx.shadowColor = s.c;
    fctx.beginPath(); fctx.arc(s.x, s.y, s.size, 0, 7); fctx.fill();
  }
  fctx.shadowBlur = 0; fctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
