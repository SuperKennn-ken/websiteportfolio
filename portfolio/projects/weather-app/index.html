<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App | Jhon Kenneth Sevillano</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  /* ================= ANIMATABLE THEME COLORS ================= */
  @property --c1{syntax:'<color>';inherits:true;initial-value:#38bdf8}
  @property --c2{syntax:'<color>';inherits:true;initial-value:#0ea5e9}
  @property --c3{syntax:'<color>';inherits:true;initial-value:#16a34a}
  @property --glow{syntax:'<color>';inherits:true;initial-value:rgba(0,0,0,0)}
  @property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    --cloud:#fff;--clouds:0;--fog:0;
    font-family:'Outfit','Segoe UI',Tahoma,sans-serif;color:#fff;
    min-height:100vh;display:grid;place-items:center;padding:20px;
    background:linear-gradient(160deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%) fixed;
    transition:--c1 1.4s ease,--c2 1.4s ease,--c3 1.4s ease,--glow 1.4s ease;
    overflow-x:hidden;perspective:1200px;
  }
  body[data-wx="clear"] {--c1:#38bdf8;--c2:#0ea5e9;--c3:#16a34a;--glow:rgba(253,224,71,.55)}
  body[data-wx="partly"]{--c1:#60a5fa;--c2:#3b82f6;--c3:#15803d;--glow:rgba(253,224,71,.3);--clouds:.75}
  body[data-wx="cloudy"]{--c1:#64748b;--c2:#475569;--c3:#14532d;--clouds:.95;--cloud:#e2e8f0}
  body[data-wx="fog"]   {--c1:#94a3b8;--c2:#64748b;--c3:#334155;--clouds:.5;--fog:1;--cloud:#e2e8f0}
  body[data-wx="rain"]  {--c1:#1e3a8a;--c2:#334155;--c3:#064e3b;--clouds:.9;--cloud:#94a3b8}
  body[data-wx="snow"]  {--c1:#93c5fd;--c2:#64748b;--c3:#1e3a8a;--clouds:.7;--cloud:#f1f5f9}
  body[data-wx="storm"] {--c1:#1e1b4b;--c2:#312e81;--c3:#0f172a;--clouds:1;--cloud:#475569}
  body[data-wx="night"] {--c1:#020617;--c2:#0b1b3a;--c3:#052e16;--glow:rgba(191,219,254,.22);--clouds:.2;--cloud:#334155}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes angSpin{to{--ang:360deg}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}

  /* ================= BACKGROUND SCENE ================= */
  .glow,.sky-clouds,.fog-layer,#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
  .glow{background:radial-gradient(circle at 85% 10%,var(--glow),transparent 45%)}
  .sky-clouds{opacity:var(--clouds);transition:opacity 1.2s;overflow:hidden}
  .cloud{position:absolute;left:0;top:var(--t);width:var(--w);height:calc(var(--w) * .32);
    border-radius:999px;background:var(--cloud);transition:background 1.2s;
    filter:drop-shadow(0 10px 16px rgba(0,0,0,.15));
    animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
  .cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .cloud::before{width:50%;height:150%;left:15%;top:-70%}
  .cloud::after{width:36%;height:115%;left:50%;top:-45%}
  @keyframes drift{from{translate:-30vw 0}to{translate:130vw 0}}

  .fog-layer{opacity:var(--fog);transition:opacity 1.2s;overflow:hidden}
  .fog-layer::before,.fog-layer::after{content:"";position:absolute;left:-50%;width:200%;height:45%;
    background:radial-gradient(ellipse at center,rgba(255,255,255,.5),transparent 65%);filter:blur(24px);
    animation:fogMove 22s ease-in-out infinite alternate}
  .fog-layer::before{top:20%}
  .fog-layer::after{top:55%;animation-direction:alternate-reverse;animation-duration:28s}
  @keyframes fogMove{to{transform:translateX(25%)}}

  .flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:#e0e7ff;opacity:0}
  .flash.on{animation:flash .7s ease-out}
  @keyframes flash{0%{opacity:0}8%{opacity:.55}16%{opacity:.1}24%{opacity:.4}100%{opacity:0}}

  /* ================= CARD ================= */
  .container{position:relative;z-index:1;width:100%;max-width:520px}
  .weather-card{
    --mx:50%;--my:50%;
    position:relative;isolation:isolate;padding:2.2rem;border-radius:28px;
    background:rgba(8,18,32,.42);
    backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
    box-shadow:0 30px 80px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);
    transform-style:preserve-3d;will-change:transform;
    animation:cardIn 1s cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(60px) rotateX(22deg) scale(.92);filter:blur(10px)}}
  .weather-card::before{content:"";position:absolute;inset:-2px;border-radius:30px;padding:2px;z-index:-1;
    background:conic-gradient(from var(--ang),#4ade80,#22d3ee,#60a5fa,#facc15,#4ade80);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;animation:angSpin 6s linear infinite;opacity:.85}
  .spot{position:absolute;inset:0;border-radius:28px;pointer-events:none;z-index:-1;
    background:radial-gradient(380px circle at var(--mx) var(--my),rgba(255,255,255,.12),transparent 60%);
    opacity:0;transition:opacity .4s}
  .weather-card:hover .spot{opacity:1}
  .weather-card.shake{animation:shake .5s ease}
  @keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

  /* ---------- header ---------- */
  .head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.5rem;transform:translateZ(30px)}
  h1{display:flex;align-items:center;gap:10px;font-size:1.6rem;font-weight:900;letter-spacing:-.3px}
  h1 i{color:#facc15;filter:drop-shadow(0 0 10px rgba(250,204,21,.6));animation:bobIcon 3s ease-in-out infinite}
  @keyframes bobIcon{50%{transform:translateY(-4px) rotate(-8deg)}}
  h1 span{background:linear-gradient(90deg,#fff,#bbf7d0,#a5f3fc,#fff);background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
  @keyframes shine{to{background-position:200% center}}
  .clock{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .clock .dot{width:7px;height:7px;border-radius:50%;background:#4ade80;animation:ping 1.8s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%,100%{box-shadow:0 0 0 9px rgba(74,222,128,0)}}

  /* ---------- search ---------- */
  .search-box{position:relative;margin-bottom:1.4rem;transform:translateZ(25px)}
  .search-box input{width:100%;padding:15px 60px 15px 46px;border-radius:999px;font:inherit;font-size:1rem;color:#fff;
    background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);outline:none;transition:.3s}
  .search-box input::placeholder{color:rgba(255,255,255,.6)}
  .search-box input:focus{border-color:#4ade80;background:rgba(255,255,255,.16);box-shadow:0 0 0 5px rgba(74,222,128,.18),0 0 30px rgba(74,222,128,.3)}
  .search-box .pin{position:absolute;left:18px;top:50%;transform:translateY(-50%);opacity:.7;transition:.3s}
  .search-box input:focus ~ .pin{color:#4ade80;opacity:1;animation:pinBounce .6s}
  @keyframes pinBounce{40%{transform:translateY(-80%)}}
  .search-box button{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;
    border:none;cursor:pointer;color:#fff;font-size:1rem;overflow:hidden;
    background:linear-gradient(135deg,#16a34a,#22d3ee);box-shadow:0 6px 18px rgba(22,163,74,.5);transition:.3s}
  .search-box button:hover{transform:translateY(-50%) scale(1.1);box-shadow:0 8px 26px rgba(34,211,238,.6)}
  .search-box button:hover i{animation:spinOnce .6s}
  @keyframes spinOnce{to{transform:rotate(360deg)}}

  /* ---------- error ---------- */
  .error-message{display:none;align-items:center;gap:10px;padding:.9rem 1.1rem;margin-bottom:1rem;border-radius:14px;
    background:rgba(239,68,68,.25);border:1px solid rgba(248,113,113,.6);color:#fee2e2;text-align:left}
  .error-message.show{display:flex;animation:rise .4s}

  /* ---------- skeleton loading ---------- */
  .loading{display:none;padding:.5rem 0 1rem}
  .loading.show{display:block}
  .sk{background:linear-gradient(90deg,rgba(255,255,255,.07) 25%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.07) 75%);
    background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:12px}
  @keyframes shimmer{to{background-position:-200% 0}}
  .sk-title{width:55%;height:26px;margin:0 auto 1.2rem}
  .sk-hero{width:150px;height:120px;margin:0 auto 1rem;border-radius:50%}
  .sk-line{width:40%;height:18px;margin:0 auto 1.5rem}
  .sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
  .sk-grid .sk{height:90px;border-radius:16px}

  /* ---------- weather info ---------- */
  .weather-info{display:none;text-align:center}
  .weather-info.show{display:block}
  .reveal{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--d,0) * 90ms)}

  .location{display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.8rem;font-weight:800}
  .location i{color:#4ade80;animation:pinBounce 1.6s ease-in-out infinite}
  .sub{margin-top:.2rem;font-size:.95rem;opacity:.8}
  .badge{display:inline-block;margin-left:.4rem;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:600;
    letter-spacing:.05em;background:rgba(74,222,128,.2);border:1px solid rgba(74,222,128,.5);vertical-align:2px}
  .badge.demo{background:rgba(250,204,21,.18);border-color:rgba(250,204,21,.5)}

  .hero{display:flex;align-items:center;justify-content:center;gap:1.2rem;margin:1rem 0 .3rem;transform:translateZ(45px)}
  .temperature{font-size:4.8rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff 30%,#bbf7d0);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 20px rgba(0,0,0,.25))}
  .temperature sup{font-size:.4em;vertical-align:1.3em;margin-left:2px}
  .units{position:relative;display:inline-flex;margin-top:.6rem;padding:3px;border-radius:999px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
  .units::before{content:"";position:absolute;top:3px;left:3px;width:40px;height:calc(100% - 6px);border-radius:999px;
    background:linear-gradient(135deg,#16a34a,#22d3ee);transition:transform .45s cubic-bezier(.68,-.5,.27,1.5)}
  .units[data-active="F"]::before{transform:translateX(40px)}
  .units button{position:relative;width:40px;padding:4px 0;border:none;background:none;color:#fff;font:600 .85rem 'Outfit',sans-serif;cursor:pointer}

  .description{font-size:1.35rem;font-weight:600;text-transform:capitalize}
  .feels{font-size:.92rem;opacity:.75;margin-top:.15rem}

  /* ---------- animated weather icons ---------- */
  .wx{position:relative;width:150px;height:120px;flex-shrink:0}
  .i-sun{position:absolute;left:35px;top:20px;width:80px;height:80px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fef9c3,#facc15 55%,#f59e0b);
    box-shadow:0 0 40px 10px rgba(250,204,21,.5);animation:sunPulse 3s ease-in-out infinite}
  .i-sun::before{content:"";position:absolute;inset:-26px;border-radius:50%;
    background:repeating-conic-gradient(rgba(253,224,71,.85) 0 7deg,transparent 7deg 30deg);
    -webkit-mask:radial-gradient(circle closest-side,transparent 68%,#000 72% 88%,transparent 92%);
            mask:radial-gradient(circle closest-side,transparent 68%,#000 72% 88%,transparent 92%);
    animation:spin 14s linear infinite}
  @keyframes sunPulse{50%{box-shadow:0 0 64px 20px rgba(250,204,21,.6)}}
  .i-moon{position:absolute;left:38px;top:20px;width:76px;height:76px;border-radius:50%;
    background:radial-gradient(circle at 70% 30%,transparent 0 30px,#f1f5f9 31px);
    filter:drop-shadow(0 0 16px rgba(191,219,254,.85));animation:rock 6s ease-in-out infinite}
  @keyframes rock{50%{transform:rotate(-12deg) translateY(-4px)}}
  .wx.partly .i-sun,.wx.partly .i-moon{left:14px;top:4px;width:62px;height:62px}
  .wx.partly .i-moon{background:radial-gradient(circle at 70% 30%,transparent 0 23px,#f1f5f9 24px)}

  .i-cloud{position:absolute;left:24px;top:56px;width:108px;height:40px;border-radius:999px;background:var(--cc,#fff);
    box-shadow:0 8px 18px rgba(0,0,0,.18);animation:cloudBob 5s ease-in-out infinite}
  .i-cloud::before,.i-cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
  .i-cloud::before{width:48px;height:48px;left:18px;top:-26px}
  .i-cloud::after{width:36px;height:36px;left:54px;top:-18px}
  .i-cloud.back{--cc:#cbd5e1;left:2px;top:38px;scale:.72;animation-duration:7s;animation-direction:reverse}
  .wx.rain .i-cloud{--cc:#cbd5e1} .wx.rain .i-cloud.back{--cc:#94a3b8}
  .wx.storm .i-cloud{--cc:#94a3b8} .wx.storm .i-cloud.back{--cc:#64748b}
  @keyframes cloudBob{50%{transform:translateX(6px)}}

  .i-rain,.i-snow{position:absolute;left:40px;top:96px;width:80px;height:30px}
  .i-rain i{position:absolute;top:0;width:3px;height:14px;border-radius:3px;background:linear-gradient(transparent,#7dd3fc);animation:dropI .9s linear infinite}
  .i-rain i:nth-child(1){left:6px} .i-rain i:nth-child(2){left:22px;animation-delay:.3s}
  .i-rain i:nth-child(3){left:38px;animation-delay:.6s} .i-rain i:nth-child(4){left:54px;animation-delay:.15s}
  .i-rain i:nth-child(5){left:70px;animation-delay:.45s}
  @keyframes dropI{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}
  .i-snow i{position:absolute;top:0;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:flakeI 2.2s linear infinite}
  .i-snow i:nth-child(1){left:4px} .i-snow i:nth-child(2){left:18px;animation-delay:.7s}
  .i-snow i:nth-child(3){left:32px;animation-delay:1.4s} .i-snow i:nth-child(4){left:46px;animation-delay:.35s}
  .i-snow i:nth-child(5){left:60px;animation-delay:1.05s} .i-snow i:nth-child(6){left:72px;animation-delay:1.75s}
  @keyframes flakeI{0%{transform:translate(0,-4px);opacity:0}20%{opacity:1}50%{transform:translate(5px,12px)}100%{transform:translate(-3px,28px);opacity:0}}
  .i-bolt{position:absolute;left:64px;top:84px;width:26px;height:42px;background:linear-gradient(#fef08a,#f59e0b);
    clip-path:polygon(45% 0,100% 0,62% 42%,95% 42%,20% 100%,38% 55%,5% 55%);animation:boltI 2.4s infinite}
  @keyframes boltI{0%,40%,48%,100%{opacity:1}44%,52%{opacity:.1}}
  .i-fog{position:absolute;left:18px;top:84px;width:114px}
  .i-fog i{display:block;height:6px;margin:6px 0;border-radius:6px;background:rgba(255,255,255,.8);animation:fogI 3s ease-in-out infinite alternate}
  .i-fog i:nth-child(2){width:80%;margin-left:10%;animation-delay:.5s}
  .i-fog i:nth-child(3){width:90%;animation-delay:1s}
  @keyframes fogI{to{transform:translateX(12px)}}

  /* ---------- details ---------- */
  .weather-details{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-top:1.6rem;transform:translateZ(20px)}
  .detail-item{position:relative;overflow:hidden;padding:1rem;border-radius:18px;text-align:left;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    transition:transform .35s cubic-bezier(.2,1.4,.4,1),background .3s,border-color .3s,box-shadow .3s}
  .detail-item::after{content:"";position:absolute;inset:0;transform:translateX(-100%);transition:transform .7s;
    background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.15),transparent 70%)}
  .detail-item:hover{transform:translateY(-6px) scale(1.03);background:rgba(255,255,255,.14);border-color:#4ade80;box-shadow:0 12px 28px rgba(0,0,0,.25)}
  .detail-item:hover::after{transform:translateX(100%)}
  .detail-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
  .detail-top i{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;font-size:1rem;
    background:linear-gradient(135deg,rgba(22,163,74,.55),rgba(34,211,238,.45))}
  .detail-label{font-size:.82rem;opacity:.8}
  .detail-value{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
  .meter{height:5px;margin-top:.6rem;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  .meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#4ade80);
    box-shadow:0 0 10px rgba(74,222,128,.6);transition:width 1.3s cubic-bezier(.2,.8,.2,1) .4s}
  .fa-fan.spinning{animation:spin 2s linear infinite}
  .fa-tint{animation:dripIcon 2s ease-in-out infinite}
  @keyframes dripIcon{50%{transform:translateY(3px)}}

  /* ---------- forecast ---------- */
  .forecast-title{margin:1.5rem 0 .7rem;text-align:left;font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;opacity:.7}
  .forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem}
  .day{padding:.7rem .2rem;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
    animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(.55s + var(--d) * 80ms);
    transition:transform .3s cubic-bezier(.2,1.4,.4,1),background .3s}
  .day:hover{transform:translateY(-5px);background:rgba(255,255,255,.15)}
  .dname{display:block;font-size:.78rem;font-weight:600;opacity:.85}
  .mini{position:relative;width:48px;height:39px;margin:.35rem auto}
  .mini .wx{position:absolute;left:0;top:0;scale:.32;transform-origin:0 0}
  .hi{font-weight:800;font-size:.95rem}
  .lo{font-size:.8rem;opacity:.6;margin-left:3px}

  /* ---------- chips ---------- */
  .suggested-cities{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem;justify-content:center}
  .city-chip{position:relative;overflow:hidden;padding:8px 16px;border-radius:999px;cursor:pointer;
    font:600 .88rem 'Outfit',sans-serif;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
    transition:transform .3s cubic-bezier(.2,1.4,.4,1),background .3s,box-shadow .3s,border-color .3s}
  .city-chip:hover{transform:translateY(-3px);border-color:#4ade80;box-shadow:0 8px 20px rgba(22,163,74,.4)}
  .city-chip.active{background:linear-gradient(135deg,#16a34a,#22d3ee);border-color:transparent;box-shadow:0 6px 18px rgba(34,211,238,.4)}
  .ripple{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.5);pointer-events:none;
    transform:scale(0);animation:rip .6s ease-out forwards}
  @keyframes rip{to{transform:scale(14);opacity:0}}

  /* ================= RESPONSIVE ================= */
  @media (max-width:560px){
    .weather-card{padding:1.5rem 1.2rem}
    .head{flex-direction:column;gap:.6rem}
    h1{font-size:1.4rem}
    .hero{flex-direction:column;gap:.2rem}
    .temperature{font-size:3.8rem}
    .location{font-size:1.5rem}
    .forecast{gap:.35rem}
    .day{padding:.6rem 0}
  }
  @media (max-width:380px){ .weather-details{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body data-wx="clear">
  <!-- background scene -->
  <div class="glow"></div>
  <div class="sky-clouds" aria-hidden="true">
    <div class="cloud" style="--w:220px;--t:8%;--d:80s;--dl:-10s"></div>
    <div class="cloud" style="--w:140px;--t:22%;--d:60s;--dl:-40s"></div>
    <div class="cloud" style="--w:260px;--t:60%;--d:95s;--dl:-70s"></div>
    <div class="cloud" style="--w:110px;--t:38%;--d:50s;--dl:-25s"></div>
    <div class="cloud" style="--w:180px;--t:78%;--d:75s;--dl:-5s"></div>
  </div>
  <div class="fog-layer" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="flash" id="flash"></div>

  <main class="container">
    <div class="weather-card" id="card">
      <div class="spot"></div>

      <div class="head">
        <h1><i class="fas fa-cloud-sun"></i><span>Weather App</span></h1>
        <div class="clock"><span class="dot"></span><span id="clock">--:--</span></div>
      </div>

      <form class="search-box" id="searchForm" autocomplete="off">
        <input type="text" id="cityInput" placeholder="Search any city..." aria-label="City name">
        <i class="fas fa-location-dot pin"></i>
        <button type="submit" aria-label="Search"><i class="fas fa-search"></i></button>
      </form>

      <div class="error-message" id="errorMessage" role="alert">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">City not found. Please try again.</span>
      </div>

      <div class="loading" id="loading" aria-label="Loading weather data">
        <div class="sk sk-title"></div>
        <div class="sk sk-hero"></div>
        <div class="sk sk-line"></div>
        <div class="sk-grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
      </div>

      <div class="weather-info" id="weatherInfo" aria-live="polite">
        <div class="reveal" style="--d:0">
          <div class="location"><i class="fas fa-map-marker-alt"></i><span id="cityName">Manila</span></div>
          <div class="sub"><span id="country"></span><span class="badge" id="source">LIVE</span></div>
        </div>

        <div class="hero reveal" style="--d:1">
          <div id="weatherIcon"></div>
          <div>
            <div class="temperature"><span id="temperature">0</span><sup>°<span id="unitLabel">C</span></sup></div>
            <div class="units" id="units" data-active="C">
              <button type="button" data-unit="C">°C</button>
              <button type="button" data-unit="F">°F</button>
            </div>
          </div>
        </div>

        <div class="reveal" style="--d:2">
          <div class="description" id="description">Clear sky</div>
          <div class="feels">Feels like <b id="feels">--</b></div>
        </div>

        <div class="weather-details">
          <div class="detail-item reveal" style="--d:3">
            <div class="detail-top"><i class="fas fa-fan" id="fan"></i><span class="detail-label">Wind Speed</span></div>
            <div class="detail-value"><span id="windSpeed">0</span> km/h</div>
            <div class="meter"><i id="mWind"></i></div>
          </div>
          <div class="detail-item reveal" style="--d:4">
            <div class="detail-top"><i class="fas fa-tint"></i><span class="detail-label">Humidity</span></div>
            <div class="detail-value"><span id="humidity">0</span>%</div>
            <div class="meter"><i id="mHum"></i></div>
          </div>
          <div class="detail-item reveal" style="--d:5">
            <div class="detail-top"><i class="fas fa-eye"></i><span class="detail-label">Visibility</span></div>
            <div class="detail-value"><span id="visibility">0</span> km</div>
            <div class="meter"><i id="mVis"></i></div>
          </div>
          <div class="detail-item reveal" style="--d:6">
            <div class="detail-top"><i class="fas fa-compress-arrows-alt"></i><span class="detail-label">Pressure</span></div>
            <div class="detail-value"><span id="pressure">0</span> hPa</div>
            <div class="meter"><i id="mPres"></i></div>
          </div>
        </div>

        <div class="forecast-title reveal" style="--d:6">5-Day Forecast</div>
        <div class="forecast" id="forecast"></div>
      </div>

      <div class="suggested-cities">
        <button class="city-chip" onclick="searchCity('Manila')">Manila</button>
        <button class="city-chip" onclick="searchCity('Cebu')">Cebu</button>
        <button class="city-chip" onclick="searchCity('Davao')">Davao</button>
        <button class="city-chip" onclick="searchCity('Tokyo')">Tokyo</button>
        <button class="city-chip" onclick="searchCity('New York')">New York</button>
      </div>
    </div>
  </main>

<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(hover:hover) and (pointer:fine)').matches;
const rnd = Math.random;
const state = { unit: 'C', data: null, req: 0, shownTemp: 0, offset: null };

/* ================= WEATHER CODES (WMO) ================= */
const WMO = {
  0:['Clear sky','clear'], 1:['Mainly clear','partly'], 2:['Partly cloudy','partly'], 3:['Overcast','cloudy'],
  45:['Fog','fog'], 48:['Rime fog','fog'],
  51:['Light drizzle','rain'], 53:['Drizzle','rain'], 55:['Heavy drizzle','rain'], 56:['Freezing drizzle','rain'], 57:['Freezing drizzle','rain'],
  61:['Light rain','rain'], 63:['Rain','rain'], 65:['Heavy rain','rain'], 66:['Freezing rain','rain'], 67:['Freezing rain','rain'],
  71:['Light snow','snow'], 73:['Snow','snow'], 75:['Heavy snow','snow'], 77:['Snow grains','snow'],
  80:['Rain showers','rain'], 81:['Rain showers','rain'], 82:['Violent showers','storm'],
  85:['Snow showers','snow'], 86:['Heavy snow showers','snow'],
  95:['Thunderstorm','storm'], 96:['Thunderstorm with hail','storm'], 99:['Thunderstorm with hail','storm']
};

/* ================= DATA: Open-Meteo (free, no API key) ================= */
async function fetchOpenMeteo(city) {
  const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
  if (!geoRes.ok) throw new Error('network');
  const geo = await geoRes.json();
  if (!geo.results || !geo.results.length) { const e = new Error('not found'); e.name = 'NotFound'; throw e; }
  const p = geo.results[0];

  const url = `https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,pressure_msl,visibility` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('network');
  const w = await res.json(), c = w.current;
  const [desc, type] = WMO[c.weather_code] || ['Unknown', 'cloudy'];

  return {
    name: p.name, country: [p.admin1, p.country].filter(Boolean).join(', '),
    temp: c.temperature_2m, feels: c.apparent_temperature, desc, type, day: !!c.is_day,
    wind: c.wind_speed_10m, humidity: c.relative_humidity_2m,
    visibility: c.visibility != null ? c.visibility / 1000 : null,
    pressure: c.pressure_msl, offset: w.utc_offset_seconds, live: true,
    forecast: w.daily.time.slice(1, 6).map((t, i) => ({
      date: Date.parse(t + 'T12:00:00Z'),
      type: (WMO[w.daily.weather_code[i + 1]] || [, 'cloudy'])[1],
      max: w.daily.temperature_2m_max[i + 1], min: w.daily.temperature_2m_min[i + 1]
    }))
  };
}

/* ================= DATA: offline fallback (your original mock data) ================= */
function getMockWeatherData(city) {
  const db = {
    'manila':   { name:'Manila',   country:'Philippines',   temp:32, desc:'partly cloudy', type:'partly', wind:18, humidity:75, visibility:8,  pressure:1010, offset:28800 },
    'cebu':     { name:'Cebu',     country:'Philippines',   temp:30, desc:'sunny',         type:'clear',  wind:12, humidity:70, visibility:10, pressure:1012, offset:28800 },
    'davao':    { name:'Davao',    country:'Philippines',   temp:28, desc:'light rain',    type:'rain',   wind:15, humidity:85, visibility:7,  pressure:1008, offset:28800 },
    'tokyo':    { name:'Tokyo',    country:'Japan',         temp:22, desc:'clear sky',     type:'clear',  wind:10, humidity:60, visibility:10, pressure:1015, offset:32400 },
    'new york': { name:'New York', country:'United States', temp:18, desc:'cloudy',        type:'cloudy', wind:20, humidity:55, visibility:9,  pressure:1013, offset:-14400 }
  };
  const d = db[city.toLowerCase()];
  if (!d) return null;
  const local = Date.now() + d.offset * 1000, h = new Date(local).getUTCHours();
  const cycle = ['clear', 'partly', 'cloudy', 'rain', 'partly'];
  return { ...d, feels: d.temp + 2, day: h >= 6 && h < 18, live: false,
    forecast: Array.from({ length: 5 }, (_, i) => ({
      date: local + (i + 1) * 864e5, type: i === 0 ? d.type : cycle[(i + d.temp) % 5],
      max: d.temp + ((i * 7) % 5) - 2, min: d.temp - 6 + ((i * 3) % 4)
    })) };
}

async function fetchWeather(city) {
  try { return await fetchOpenMeteo(city); }
  catch (e) {
    if (e.name === 'NotFound') throw new Error(`Couldn't find "${city}". Check the spelling and try again.`);
    const mock = getMockWeatherData(city);
    if (mock) return mock;
    throw new Error("Can't reach the weather service. Check your internet connection.");
  }
}

/* ================= SEARCH FLOW ================= */
const wait = ms => new Promise(r => setTimeout(r, ms));

async function getWeather() {
  const city = $('#cityInput').value.trim();
  if (!city) return showError('Please enter a city name');
  const id = ++state.req;
  hideError(); hideWeatherInfo(); showLoading(true);
  try {
    const [data] = await Promise.all([fetchWeather(city), wait(650)]);
    if (id !== state.req) return;
    displayWeather(data);
    showWeatherInfo();
  } catch (err) {
    if (id === state.req) showError(err.message);
  } finally {
    if (id === state.req) showLoading(false);
  }
}
function searchCity(name) { $('#cityInput').value = name; getWeather(); }
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); getWeather(); });

/* ================= ICONS ================= */
function iconHTML(type, day) {
  const orb = day ? '<div class="i-sun"></div>' : '<div class="i-moon"></div>';
  const cloud = (c = '') => `<div class="i-cloud ${c}"></div>`;
  const inner = {
    clear:  orb,
    partly: orb + cloud(),
    cloudy: cloud('back') + cloud(),
    fog:    cloud('back') + '<div class="i-fog"><i></i><i></i><i></i></div>',
    rain:   cloud('back') + cloud() + `<div class="i-rain">${'<i></i>'.repeat(5)}</div>`,
    snow:   cloud() + `<div class="i-snow">${'<i></i>'.repeat(6)}</div>`,
    storm:  cloud('back') + cloud() + '<div class="i-bolt"></div>' + `<div class="i-rain">${'<i></i>'.repeat(4)}</div>`
  }[type] || cloud();
  return `<div class="wx ${type}">${inner}</div>`;
}

/* ================= RENDER ================= */
function countTo(el, to, { from = 0, dur = 1100, dec = 0 } = {}) {
  const token = el._t = Symbol();
  if (reduce) { el.textContent = to.toFixed(dec); return; }
  const t0 = performance.now();
  (function tick(t) {
    if (el._t !== token) return;
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    el.textContent = (from + (to - from) * e).toFixed(dec);
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}
const conv = c => state.unit === 'C' ? c : c * 9 / 5 + 32;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function renderTemps() {
  const d = state.data; if (!d) return;
  const target = Math.round(conv(d.temp));
  countTo($('#temperature'), target, { from: state.shownTemp });
  state.shownTemp = target;
  $('#unitLabel').textContent = state.unit;
  $('#feels').textContent = Math.round(conv(d.feels)) + '°' + state.unit;

  $$('#forecast .hi').forEach(el => el.textContent = Math.round(conv(+el.dataset.c)) + '°');

  $$('#forecast .lo').forEach(el => el.textContent = Math.round(conv(+el.dataset.c)) + '°');
}

function displayWeather(d) {
  state.data = d;
  state.offset = d.offset;
  const night = !d.day && (d.type === 'clear' || d.type === 'partly');
  const mode = night ? 'night' : d.type;
  document.body.dataset.wx = mode;
  setMode(mode);

  $('#cityName').textContent = d.name;
  $('#country').textContent = d.country;
  const src = $('#source');
  src.textContent = d.live ? 'LIVE' : 'DEMO DATA';
  src.classList.toggle('demo', !d.live);

  $$('.city-chip').forEach(c => c.classList.toggle('active', c.textContent.toLowerCase() === d.name.toLowerCase()));

  $('#weatherIcon').innerHTML = iconHTML(d.type, d.day);
  $('#description').textContent = d.desc;

  countTo($('#windSpeed'), Math.round(d.wind));
  countTo($('#humidity'), Math.round(d.humidity));
  if (d.visibility == null) $('#visibility').textContent = '—';
  else countTo($('#visibility'), d.visibility, { dec: d.visibility < 10 ? 1 : 0 });
  countTo($('#pressure'), Math.round(d.pressure), { from: 950 });

  const fan = $('#fan');
  fan.classList.toggle('spinning', d.wind > 0);
  fan.style.animationDuration = clamp(6 - d.wind / 8, .35, 6) + 's';

  const meters = { mWind: d.wind / 60, mHum: d.humidity / 100, mVis: (d.visibility ?? 0) / 20, mPres: (d.pressure - 970) / 80 };
  Object.entries(meters).forEach(([id, v]) => {
    const el = document.getElementById(id);
    el.style.transition = 'none'; el.style.width = '0'; void el.offsetWidth;
    el.style.transition = ''; el.style.width = clamp(v, .04, 1) * 100 + '%';
  });

  $('#forecast').innerHTML = d.forecast.map((f, i) => `
    <div class="day" style="--d:${i}">
      <span class="dname">${new Date(f.date).toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' })}</span>
      <div class="mini">${iconHTML(f.type, true)}</div>
      <span class="hi" data-c="${f.max}"></span><span class="lo" data-c="${f.min}"></span>
    </div>`).join('');

  renderTemps();
  updateClock();
}

/* unit toggle */

$$('#units button').forEach(b => b.addEventListener('click', () => {
  if (state.unit === b.dataset.unit) return;
  state.unit = b.dataset.unit;
  $('#units').dataset.active = state.unit;
  renderTemps();
}));

/* local clock of the searched city */
function updateClock() {
  const opts = { hour: 'numeric', minute: '2-digit', weekday: 'short' };
  $('#clock').textContent = state.offset == null
    ? new Date().toLocaleTimeString('en-US', opts)
    : new Date(Date.now() + state.offset * 1000).toLocaleTimeString('en-US', { ...opts, timeZone: 'UTC' });
}
setInterval(updateClock, 1000); updateClock();

/* ================= UI HELPERS ================= */
const card = $('#card');
function showLoading(show) { $('#loading').classList.toggle('show', show); }
function showWeatherInfo() { $('#weatherInfo').classList.add('show'); }
function hideWeatherInfo() { $('#weatherInfo').classList.remove('show'); }
function showError(msg) {
  $('#errorText').textContent = msg;
  const el = $('#errorMessage');
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}
function hideError() { $('#errorMessage').classList.remove('show'); }
card.addEventListener('animationend', e => { if (e.animationName === 'shake') card.classList.remove('shake'); });

/* ripple */
document.addEventListener('click', e => {
  const b = e.target.closest('.city-chip, .search-box button');
  if (!b) return;
  const r = b.getBoundingClientRect(), s = document.createElement('span');
  s.className = 'ripple';
  s.style.left = e.clientX - r.left - 6 + 'px'; s.style.top = e.clientY - r.top - 6 + 'px';
  b.appendChild(s); setTimeout(() => s.remove(), 650);
});

/* ================= WEATHER PARTICLE SCENE ================= */
const cv = $('#fx'), ctx = cv.getContext('2d');
let W, H, mode = 'clear', P = [], shooters = [], bolts = [], nextFlash = 0;
const mouse = { x: innerWidth / 2, y: innerHeight / 2, in: false };
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.in = true; });
document.addEventListener('mouseleave', () => mouse.in = false);

function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; setMode(mode); }
function make(m) {
  if (m === 'rain' || m === 'storm') return { x: rnd() * W * 1.3, y: rnd() * H, l: rnd() * 14 + 12, v: rnd() * 8 + 12, a: rnd() * .35 + .2 };
  if (m === 'snow')  return { x: rnd() * W, y: rnd() * H, r: rnd() * 2.6 + 1, v: rnd() * .9 + .5, ph: rnd() * 6.28, a: rnd() * .5 + .5 };
  if (m === 'night') return { x: rnd() * W, y: rnd() * H * .8, r: rnd() * 1.3 + .3, ph: rnd() * 6.28, sp: rnd() * 2 + .5 };
  return { x: rnd() * W, y: rnd() * H, r: rnd() * 2 + 1, vx: (rnd() - .5) * .25, vy: -(rnd() * .3 + .1), ph: rnd() * 6.28 };
}
function setMode(m) {
  mode = m;
  if (reduce) { P = []; return; }
  const n = { rain: 170, storm: 260, snow: 130, night: 150, clear: 45, partly: 30, cloudy: 18, fog: 18 }[m] || 20;
  P = Array.from({ length: n }, () => make(m));
}
addEventListener('resize', resize); resize();

function lightning(now) {
  $('#flash').classList.remove('on'); void $('#flash').offsetWidth; $('#flash').classList.add('on');
  let x = W * (.15 + rnd() * .7), y = 0;
  const pts = [[x, y]];
  while (y < H * .6) { x += (rnd() - .5) * 60; y += rnd() * 40 + 20; pts.push([x, y]); }
  bolts.push({ pts, life: 1 });
  nextFlash = now + 4000 + rnd() * 6000;
}

/* tilt state */
let tx = 0, ty = 0;

function loop(now) {
  const t = now / 1000;
  ctx.clearRect(0, 0, W, H);

  if (mode === 'rain' || mode === 'storm') {
    const slant = mode === 'storm' ? -4 : -2;
    ctx.lineWidth = 1.2; ctx.lineCap = 'round';
    for (const p of P) {
      p.y += p.v; p.x += slant;
      if (p.y > H) { p.y = -20; p.x = rnd() * W * 1.3; }
      ctx.strokeStyle = `rgba(191,219,254,${p.a})`;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + slant * 1.5, p.y + p.l); ctx.stroke();
    }
    if (mode === 'storm' && now > nextFlash) nextFlash ? lightning(now) : (nextFlash = now + 2500);
  } else if (mode === 'snow') {
    ctx.fillStyle = '#fff';
    for (const p of P) {
      p.y += p.v; p.x += Math.sin(t + p.ph) * .6;
      if (p.y > H + 5) { p.y = -5; p.x = rnd() * W; }
      ctx.globalAlpha = p.a; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
  } else if (mode === 'night') {
    ctx.fillStyle = '#fff';
    for (const s of P) {
      ctx.globalAlpha = .25 + .75 * Math.abs(Math.sin(t * s.sp + s.ph));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    }
    if (rnd() < .006) shooters.push({ x: W * (.3 + rnd() * .7), y: rnd() * H * .3, vx: -(7 + rnd() * 5), vy: 3 + rnd() * 2, life: 1 });
  } else {
    for (const p of P) {
      p.x += p.vx + Math.sin(t + p.ph) * .2; p.y += p.vy;
      if (p.y < -10) { p.y = H + 10; p.x = rnd() * W; }
      if (mouse.in) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
        if (d < 100 && d > 0) { p.x += dx / d * 1.2; p.y += dy / d * 1.2; }
      }
      ctx.globalAlpha = .35 + .35 * Math.sin(t * 2 + p.ph);
      ctx.fillStyle = mode === 'clear' ? '#fef08a' : '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  /* shooting stars */
  shooters = shooters.filter(s => s.life > 0 && mode === 'night');
  for (const s of shooters) {
    s.x += s.vx; s.y += s.vy; s.life -= .018;
    const g = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 12, s.y - s.vy * 12);
    g.addColorStop(0, `rgba(255,255,255,${s.life})`); g.addColorStop(1, 'rgba(147,197,253,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 12, s.y - s.vy * 12); ctx.stroke();
  }

  /* lightning bolts */
  bolts = bolts.filter(b => b.life > 0);
  for (const b of bolts) {
    ctx.strokeStyle = `rgba(224,231,255,${b.life})`; ctx.lineWidth = 2.5;
    ctx.shadowBlur = 25; ctx.shadowColor = '#a5b4fc';
    ctx.beginPath(); b.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    ctx.shadowBlur = 0; b.life -= .06;
  }

  /* card tilt + spotlight */
  if (finePointer && !reduce) {
    const r = card.getBoundingClientRect();
    const over = mouse.in && mouse.x > r.left && mouse.x < r.right && mouse.y > r.top && mouse.y < r.bottom;
    const x = (mouse.x - r.left) / r.width - .5, y = (mouse.y - r.top) / r.height - .5;
    tx += ((over ? x * 10 : 0) - tx) * .08;
    ty += ((over ? -y * 10 : 0) - ty) * .08;
    if (!card.classList.contains('shake')) card.style.transform = `rotateY(${tx}deg) rotateX(${ty}deg)`;
    card.style.setProperty('--mx', (x + .5) * 100 + '%');
    card.style.setProperty('--my', (y + .5) * 100 + '%');
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= START ================= */
window.addEventListener('load', () => searchCity('Manila'));
</script>
</body>
</html>
